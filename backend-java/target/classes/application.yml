server:
  port: 8001

spring:
  application:
    name: vkusplan-backend

  datasource:
    url: jdbc:sqlite:./app-java.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true