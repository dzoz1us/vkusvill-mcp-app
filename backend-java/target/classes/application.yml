server:
  port: 8000

spring:
  application:
    name: vkusplan-backend

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:sqlite:./app-java.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  frontend-origin: http://localhost:5173
  mcp-url: https://mcp.vkusvill.ru/mcp
  mcp-timeout-ms: 10000
  enable-live-mcp: false
  search-cache-ttl-seconds: 1800