server:
  port: 8000

spring:
  application:
    name: vkusplan-backend

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edoplan}
    username: ${DB_USER:edoplan}
    password: ${DB_PASSWORD:edoplan}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  frontend-origin: http://localhost:5173
  mcp-url: https://mcp.vkusvill.ru/mcp
  mcp-timeout-ms: 10000
  enable-live-mcp: true
  search-cache-ttl-seconds: 1800