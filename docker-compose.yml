# Весь проект одной командой:  docker compose up --build
# Сайт откроется на http://localhost:8080, API — на http://localhost:8000.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: menyushka
      POSTGRES_USER: menyushka
      POSTGRES_PASSWORD: menyushka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menyushka -d menyushka"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/menyushka
      DB_USER: menyushka
      DB_PASSWORD: menyushka
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
